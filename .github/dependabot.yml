version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # init and analyze must run the same CodeQL version; bumped apart, the
      # analyze step refuses the configuration init wrote.
      codeql:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
