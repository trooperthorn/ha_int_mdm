# Compiles the DPC on every change so a Kotlin or Gradle regression is caught
# before a release; it does not run the app. Provisioning checks are manual
# and recorded in docs/live_qualification.md.
name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    name: assembleDebug (AGP 9.4, Gradle 9.7.1)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Compile the debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Verify the version field matches the integration
        working-directory: .
        run: python3 scripts/build_release_artifacts.py --validate-only
